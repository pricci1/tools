plugins { id 'com.android.application' }

android {
    namespace 'dev.graywake'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.graywake'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// No runtime dependencies. The domain test runner also runs without Gradle/Android.
tasks.register('coreTest', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files(
        layout.buildDirectory.dir('intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes'),
        layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'))
    mainClass = 'dev.graywake.core.CoreTests'
}

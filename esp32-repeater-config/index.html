<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>ESP32 Repeater Config</title> <style>   *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }    :root {     --bg: #0f1117;     --surface: #1a1d27;     --surface2: #22263a;     --border: #2e3250;     --accent: #4f7cff;     --accent-glow: rgba(79,124,255,0.25);     --success: #3ecf8e;     --error: #ff5e6c;     --warn: #f5a623;     --text: #e8eaf6;     --text-muted: #7b82a8;     --radius: 14px;   }    body {     font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;     background: var(--bg);     color: var(--text);     min-height: 100vh;     display: flex;     flex-direction: column;     align-items: center;     justify-content: center;     padding: 20px;   }    .card {     background: var(--surface);     border: 1px solid var(--border);     border-radius: var(--radius);     width: 100%;     max-width: 420px;     overflow: hidden;     box-shadow: 0 20px 60px rgba(0,0,0,0.5);   }    .card-header {     padding: 28px 28px 20px;     border-bottom: 1px solid var(--border);   }    .logo-row {     display: flex;     align-items: center;     gap: 12px;     margin-bottom: 6px;   }    .logo-icon {     width: 40px;     height: 40px;     background: linear-gradient(135deg, var(--accent), #8b5cf6);     border-radius: 10px;     display: flex;     align-items: center;     justify-content: center;     font-size: 20px;     box-shadow: 0 4px 14px var(--accent-glow);   }    h1 { font-size: 18px; font-weight: 700; }   .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }    .status-bar {     display: flex;     align-items: center;     gap: 8px;     padding: 10px 28px;     background: var(--surface2);     border-bottom: 1px solid var(--border);     font-size: 13px;     min-height: 42px;   }    .dot {     width: 8px; height: 8px;     border-radius: 50%;     background: var(--text-muted);     flex-shrink: 0;     transition: background 0.3s;   }   .dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }   .dot.connecting { background: var(--warn); animation: pulse 1s infinite; }   .dot.error { background: var(--error); }    @keyframes pulse {     0%, 100% { opacity: 1; } 50% { opacity: 0.3; }   }    .card-body { padding: 24px 28px; }    .field { margin-bottom: 18px; }   label {     display: block;     font-size: 12px;     font-weight: 600;     color: var(--text-muted);     text-transform: uppercase;     letter-spacing: 0.06em;     margin-bottom: 8px;   }    .input-wrap { position: relative; }    input[type="text"], input[type="password"] {     width: 100%;     background: var(--surface2);     border: 1px solid var(--border);     border-radius: 10px;     padding: 12px 44px 12px 14px;     color: var(--text);     font-size: 15px;     outline: none;     transition: border-color 0.2s, box-shadow 0.2s;   }   input:focus {     border-color: var(--accent);     box-shadow: 0 0 0 3px var(--accent-glow);   }   input:disabled { opacity: 0.4; cursor: not-allowed; }    .toggle-vis {     position: absolute;     right: 12px; top: 50%;     transform: translateY(-50%);     background: none; border: none;     color: var(--text-muted);     cursor: pointer;     font-size: 16px;     padding: 4px;   }   .toggle-vis:hover { color: var(--text); }    .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }    .actions { display: flex; gap: 10px; margin-top: 4px; }    btn, .btn {     display: inline-flex;     align-items: center;     justify-content: center;     gap: 7px;     border: none;     border-radius: 10px;     padding: 13px 20px;     font-size: 14px;     font-weight: 600;     cursor: pointer;     transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;     flex: 1;   }   .btn:active { transform: scale(0.97); }   .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }    .btn-primary {     background: linear-gradient(135deg, var(--accent), #6b64ff);     color: #fff;     box-shadow: 0 4px 14px var(--accent-glow);   }   .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px var(--accent-glow); }    .btn-secondary {     background: var(--surface2);     color: var(--text);     border: 1px solid var(--border);   }   .btn-secondary:hover:not(:disabled) { border-color: var(--accent); }    .btn-danger {     background: rgba(255,94,108,0.12);     color: var(--error);     border: 1px solid rgba(255,94,108,0.25);   }    .log-section {     padding: 0 28px 24px;   }   .log-label {     font-size: 11px;     font-weight: 600;     color: var(--text-muted);     text-transform: uppercase;     letter-spacing: 0.06em;     margin-bottom: 8px;   }   .log {     background: var(--surface2);     border: 1px solid var(--border);     border-radius: 10px;     padding: 12px 14px;     font-family: 'SF Mono', 'Fira Code', monospace;     font-size: 12px;     height: 130px;     overflow-y: auto;     line-height: 1.7;   }   .log-entry { display: flex; gap: 8px; }   .log-time { color: var(--text-muted); flex-shrink: 0; }   .log-msg.ok { color: var(--success); }   .log-msg.err { color: var(--error); }   .log-msg.info { color: var(--text); }   .log-msg.warn { color: var(--warn); }    .unsupported {     text-align: center;     padding: 32px 28px;     color: var(--text-muted);     font-size: 14px;     line-height: 1.6;   }   .unsupported .big { font-size: 40px; margin-bottom: 12px; }   .unsupported strong { color: var(--error); } </style> </head> <body>  <div class="card">   <div class="card-header">     <div class="logo-row">       <div class="logo-icon">📡</div>       <div>         <h1>ESP32 Repeater</h1>         <div class="subtitle">WiFi Credential Configurator</div>       </div>     </div>   </div>    <div class="status-bar">     <div class="dot" id="dot"></div>     <span id="status-text">Not connected</span>   </div>    <div id="unsupported-msg" class="unsupported" style="display:none">     <div class="big">🚫</div>     <strong>Web Bluetooth not supported</strong><br><br>     Use <b>Chrome for Android</b> or <b>Chrome / Edge on desktop</b>.<br>     iOS Safari does not support Web Bluetooth.   </div>    <div id="main-ui">     <div class="card-body">       <div class="field">         <label>Upstream WiFi SSID</label>         <div class="input-wrap">           <input type="text" id="ssid" placeholder="Your network name" maxlength="32" />         </div>         <div class="hint">Max 32 characters</div>       </div>        <div class="field">         <label>Password</label>         <div class="input-wrap">           <input type="password" id="password" placeholder="Your network password" maxlength="64" />           <button class="toggle-vis" title="Show/hide password" id="vis-btn">👁</button>         </div>         <div class="hint">Max 64 characters · Leave blank for open networks</div>       </div>        <div class="actions">         <button class="btn btn-secondary" id="btn-connect">           🔵 Connect BLE         </button>         <button class="btn btn-primary" id="btn-send" disabled>           ✈️ Apply         </button>       </div>     </div>      <div id="disconnect-row" style="display:none; padding: 0 28px 20px;">       <button class="btn btn-danger" id="btn-disconnect" style="width:100%">         ✖ Disconnect       </button>     </div>      <div class="log-section">       <div class="log-label">Activity Log</div>       <div class="log" id="log"></div>     </div>   </div> </div>  <script> // ── UUIDs — must match your firmware exactly ───────────────────────────────── const SERVICE_UUID  = '12345678-1234-1234-1234-123456789abc'; const SSID_CHAR_UUID = '12345678-1234-1234-1234-123456789abd'; const PASS_CHAR_UUID = '12345678-1234-1234-1234-123456789abe';  let device = null, server = null, ssidChar = null, passChar = null;  // ── Utility ────────────────────────────────────────────────────────────────── function log(msg, type = 'info') {   const el = document.getElementById('log');   const now = new Date();   const t = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;   const row = document.createElement('div');   row.className = 'log-entry';   row.innerHTML = `<span class="log-time">${t}</span><span class="log-msg ${type}">${msg}</span>`;   el.appendChild(row);   el.scrollTop = el.scrollHeight; }  function setStatus(text, state) {   // state: 'idle' | 'connecting' | 'connected' | 'error'   document.getElementById('status-text').textContent = text;   const dot = document.getElementById('dot');   dot.className = 'dot';   if (state === 'connected') dot.classList.add('connected');   else if (state === 'connecting') dot.classList.add('connecting');   else if (state === 'error') dot.classList.add('error'); }  function setConnected(yes) {   document.getElementById('btn-connect').disabled = yes;   document.getElementById('btn-send').disabled = !yes;   document.getElementById('disconnect-row').style.display = yes ? 'block' : 'none'; }  function toggleVis() {   const pw = document.getElementById('password');   pw.type = pw.type === 'password' ? 'text' : 'password'; }  function strToBytes(str) {   return new TextEncoder().encode(str); }  // ── BLE ────────────────────────────────────────────────────────────────────── async function connectBLE() {   try {     log('Scanning for ESP32-Repeater…', 'info');     setStatus('Scanning…', 'connecting');      device = await navigator.bluetooth.requestDevice({       filters: [{ name: 'ESP32-Repeater' }],       optionalServices: [SERVICE_UUID],     });      device.addEventListener('gattserverdisconnected', onDisconnected);     log(`Found: ${device.name}`, 'info');     setStatus('Connecting…', 'connecting');      server = await device.gatt.connect();     log('GATT connected', 'ok');      const service = await server.getPrimaryService(SERVICE_UUID);     ssidChar = await service.getCharacteristic(SSID_CHAR_UUID);     passChar  = await service.getCharacteristic(PASS_CHAR_UUID);     log('Characteristics ready', 'ok');      setStatus(`Connected — ${device.name}`, 'connected');     setConnected(true);   } catch (e) {     log(`Connect failed: ${e.message}`, 'err');     setStatus('Connection failed', 'error');     device = null;   } }  function onDisconnected() {   log('BLE disconnected', 'warn');   setStatus('Disconnected', 'idle');   setConnected(false);   ssidChar = null; passChar = null; server = null; }  async function disconnectBLE() {   if (device && device.gatt.connected) {     device.gatt.disconnect();   } }  async function sendCreds() {   const ssid = document.getElementById('ssid').value.trim();   const pass  = document.getElementById('password').value;    if (!ssid) { log('SSID cannot be empty', 'err'); return; }   if (ssid.length > 32) { log('SSID too long (max 32)', 'err'); return; }   if (pass.length > 64)  { log('Password too long (max 64)', 'err'); return; }    try {     document.getElementById('btn-send').disabled = true;     log(`Writing SSID: "${ssid}"…`, 'info');     await ssidChar.writeValueWithoutResponse(strToBytes(ssid));     log('SSID written ✓', 'ok');      // Small delay so the firmware processes the SSID write first     await new Promise(r => setTimeout(r, 100));      log('Writing password…', 'info');     await passChar.writeValueWithoutResponse(strToBytes(pass));     log('Password written ✓ — ESP32 is reconnecting', 'ok');      log('Done! Check your ESP32 serial log.', 'ok');   } catch (e) {     log(`Write error: ${e.message}`, 'err');   } finally {     document.getElementById('btn-send').disabled = false;   } }  // ── Init ───────────────────────────────────────────────────────────────────── if (!navigator.bluetooth) {   document.getElementById('unsupported-msg').style.display = 'block';   document.getElementById('main-ui').style.display = 'none'; } else {   log('Web Bluetooth ready', 'ok');   document.getElementById('btn-connect').addEventListener('click', connectBLE);   document.getElementById('btn-send').addEventListener('click', sendCreds);   document.getElementById('btn-disconnect').addEventListener('click', disconnectBLE);   document.getElementById('vis-btn').addEventListener('click', toggleVis); } </script> </body> </html>

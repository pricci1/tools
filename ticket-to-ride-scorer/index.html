<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket to Ride — Score Tracker</title>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1c1c" />
    <style>
      :root {
        --bg: oklch(0.13 0 0);
        --surface: oklch(0.18 0.006 220);
        --surface-2: oklch(0.23 0.008 220);
        --border: oklch(0.32 0.01 220);
        --ink: oklch(0.95 0.005 220);
        --muted: oklch(0.74 0.015 220);
        --primary: oklch(0.8 0.12 200);
        --primary-hover: oklch(0.85 0.12 200);
        --primary-ink: oklch(0.16 0.02 200);
        --accent: oklch(0.83 0.13 85);
        --danger: oklch(0.68 0.17 25);
        --radius-card: 12px;
        --radius-control: 10px;
        --tap: 44px;
        --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        min-height: 100vh;
        line-height: 1.4;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem;
      }

      header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      header p {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .header-title {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
      }

      .train {
        display: inline-flex;
        gap: 3px;
        align-self: center;
      }

      .train i {
        width: 16px;
        height: 11px;
        border-radius: 3px 3px 2px 2px;
      }

      .train i:nth-child(1) {
        background: oklch(0.62 0.19 25);
        border-radius: 6px 3px 2px 2px;
      }
      .train i:nth-child(2) {
        background: oklch(0.82 0.16 90);
      }
      .train i:nth-child(3) {
        background: oklch(0.62 0.14 250);
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem 0.75rem;
        flex-wrap: wrap;
      }

      .btn {
        font-size: 0.95rem;
        font-weight: 600;
        min-height: var(--tap);
        padding: 0.5rem 1.1rem;
        border: none;
        border-radius: var(--radius-control);
        cursor: pointer;
        transition:
          background 0.15s ease-out,
          color 0.15s ease-out;
      }

      .btn:focus-visible,
      .route-adjust:focus-visible,
      .special-input:focus-visible,
      .expression-operator:focus-visible,
      .edition-btn:focus-visible,
      .btn-remove-player:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-ink);
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-primary:active {
        background: oklch(0.75 0.12 200);
      }

      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        color: var(--ink);
        border-color: var(--muted);
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0.5rem 1rem 4rem;
      }

      /* Players grid */
      .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .player-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        overflow: hidden;
        animation: slideIn 0.2s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .player-card {
          animation: none;
        }
        * {
          transition-duration: 0.01ms !important;
        }
      }

      .player-header {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.75rem 0.9rem;
        border-bottom: 1px solid var(--border);
        background: color-mix(
          in oklab,
          var(--player-color, var(--surface-2)) 14%,
          var(--surface-2)
        );
      }

      .player-color-dot {
        width: 24px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid oklch(1 0 0 / 0.3);
        flex-shrink: 0;
      }

      .player-name-input {
        font-size: 1.05rem;
        font-weight: 600;
        background: transparent;
        border: none;
        border-radius: 6px;
        color: var(--ink);
        flex: 1;
        min-width: 0;
        padding: 0.4rem 0.4rem;
        margin: -0.4rem 0;
      }
      .player-name-input::placeholder {
        color: var(--muted);
      }
      .player-name-input:focus {
        outline: none;
        background: oklch(1 0 0 / 0.07);
      }

      .player-total {
        font-size: 1.5rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--primary);
        min-width: 2.5ch;
        text-align: right;
      }

      .btn-remove-player {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1rem;
        width: 36px;
        height: 36px;
        margin: -0.3rem -0.4rem -0.3rem 0;
        border-radius: 8px;
        transition:
          color 0.15s ease-out,
          background 0.15s ease-out;
        line-height: 1;
      }
      .btn-remove-player:hover {
        color: var(--danger);
        background: oklch(1 0 0 / 0.06);
      }

      .score-section {
        padding: 0.75rem 0.9rem;
      }

      .score-section-title {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }

      /* Route rows */
      .routes-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .route-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        border-radius: 8px;
        padding: 2px 0;
      }

      .route-row.inactive {
        display: none;
      }

      .route-len-badge {
        width: 1.65rem;
        height: 1.65rem;
        border-radius: 7px;
        background: var(--surface-2);
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 0.9rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        border: 1px solid var(--border);
      }

      .route-cars {
        display: inline-flex;
        gap: 2px;
        flex-shrink: 0;
        width: calc(8 * 9px + 7 * 2px);
      }

      .route-cars i {
        width: 9px;
        height: 15px;
        border-radius: 3px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        transition:
          background 0.15s ease-out,
          border-color 0.15s ease-out;
      }

      .route-row.claimed .route-cars i {
        background: var(--player-color, var(--primary));
        border-color: oklch(1 0 0 / 0.25);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .route-pts {
        font-size: 0.85rem;
        color: var(--muted);
        flex: 1;
      }

      .route-pts strong {
        color: var(--ink);
        font-weight: 600;
      }

      .route-counter {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }

      .route-count {
        min-width: 2.2ch;
        text-align: center;
        font-size: 1rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .route-adjust {
        width: var(--tap);
        height: 38px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface-2);
        color: var(--ink);
        cursor: pointer;
        line-height: 1;
        font-size: 1.2rem;
        font-weight: 600;
        transition: background 0.15s ease-out;
      }

      .route-adjust:hover:not(:disabled) {
        background: var(--border);
      }
      .route-adjust:active:not(:disabled) {
        background: var(--primary);
        color: var(--primary-ink);
        border-color: var(--primary);
      }

      .route-adjust:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* Special scores */
      .special-scores {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
        gap: 0.6rem;
      }

      .special-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .special-field label {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
      }

      .special-input {
        font-size: 1rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        width: 100%;
        min-height: var(--tap);
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface-2);
        color: var(--ink);
        text-align: center;
      }
      .special-input:focus {
        outline: none;
        border-color: var(--primary);
      }

      .destination-entry {
        display: grid;
        grid-template-columns: minmax(0, 1fr) repeat(2, var(--tap));
        gap: 4px;
      }

      .dest-input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .expression-operator {
        min-width: var(--tap);
        min-height: var(--tap);
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface-2);
        color: var(--ink);
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1;
      }

      .expression-operator:hover {
        background: var(--border);
      }

      .expression-operator:active {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-ink);
      }

      select.special-input {
        appearance: none;
        text-align: center;
      }

      button.special-input {
        cursor: pointer;
      }

      /* Divider */
      .section-divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 0;
      }

      /* Score breakdown */
      .score-breakdown {
        font-size: 0.82rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        padding: 0 0.9rem 0.75rem;
      }

      .score-breakdown strong {
        color: var(--ink);
      }

      /* Scoreboard */
      .scoreboard {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 1rem 1.1rem 0.5rem;
        margin-top: 1.5rem;
      }

      .scoreboard h2 {
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .scoreboard-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 0;
        border-top: 2px dashed var(--border);
      }

      .rank {
        font-size: 0.95rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        min-width: 1.4rem;
      }

      .scoreboard-row.rank-1 .rank,
      .scoreboard-row.rank-1 .sb-score {
        color: var(--accent);
      }

      .sb-name {
        flex: 1;
        font-size: 1rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sb-details {
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      .sb-score {
        font-size: 1.35rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        min-width: 2.5ch;
        text-align: right;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
      }

      /* Edition toggle */
      .edition-toggle {
        display: flex;
      }

      .edition-btn {
        font-size: 0.9rem;
        font-weight: 600;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        background: var(--surface);
        cursor: pointer;
        display: inline-flex;
        gap: 2px;
      }

      .edition-btn span {
        padding: 0.45rem 0.9rem;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        border-radius: 7px;
        color: var(--muted);
        transition:
          background 0.15s ease-out,
          color 0.15s ease-out;
      }

      .edition-btn span.active {
        background: var(--primary);
        color: var(--primary-ink);
      }

      .edition-btn:hover span:not(.active) {
        color: var(--ink);
      }

      /* Station control */
      .station-control {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        min-height: var(--tap);
      }

      .station-count {
        min-width: 3.2ch;
        text-align: center;
        font-size: 1rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .station-pts {
        font-size: 1rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        min-height: var(--tap);
      }

      @media (max-width: 720px) {
        header {
          padding: 0.85rem 1rem;
        }

        .controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        main {
          padding: 0.25rem 0.75rem 3rem;
        }

        .players-grid {
          grid-template-columns: 1fr;
        }

        .btn-remove-player {
          width: var(--tap);
          height: var(--tap);
          font-size: 1.15rem;
        }

        .route-adjust {
          height: var(--tap);
        }

        .special-scores {
          gap: 0.5rem;
        }
      }

      @media (max-width: 420px) {
        header {
          flex-direction: column;
          align-items: stretch;
        }

        .header-title {
          justify-content: space-between;
        }

        .edition-toggle {
          justify-content: stretch;
        }

        .edition-btn {
          flex: 1;
        }

        .edition-btn span {
          flex: 1;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <ttr-score-app></ttr-score-app>

    <script type="importmap">
      {
        "imports": {
          "tinybase": "https://esm.sh/tinybase@7.3.4",
          "tinybase/": "https://esm.sh/tinybase@7.3.4/"
        }
      }
    </script>

    <script type="module">
      import { createStore } from "tinybase";
      import { createCustomPersister } from "tinybase/persisters";

      const ROUTE_POINTS = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 10, 6: 15, 8: 21 };
      const PLAYER_COLORS = ["#2980b9", "#e74c3c", "#2c3e50", "#f1c40f", "#27ae60", "#ecf0f1"];
      const URL_STATE_KEY = "s";
      const VALUES_SCHEMA = {
        nextPlayerId: { type: "number", default: 1 },
        nextRouteId: { type: "number", default: 1 },
        edition: { type: "string", default: "original" },
      };
      const TABLES_SCHEMA = {
        players: {
          name: { type: "string", default: "Player" },
          color: { type: "string", default: PLAYER_COLORS[0] },
          destinationPoints: { type: "number", default: 0 },
          longestRoute: { type: "boolean", default: false },
          stationsUsed: { type: "number", default: 0 },
          order: { type: "number", default: 0 },
        },
        routes: {
          playerId: { type: "string" },
          len: { type: "number", default: 1 },
          order: { type: "number", default: 0 },
        },
      };

      function encodeContentForUrl(content) {
        const json = JSON.stringify(content);
        const bytes = new TextEncoder().encode(json);
        let binary = "";
        bytes.forEach((byte) => {
          binary += String.fromCharCode(byte);
        });
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function decodeContentFromUrl(encoded) {
        const normalized = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - (normalized.length % 4 || 4)) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      }

      function calculateDestinationPoints(expression) {
        const compact = String(expression).replace(/\s/g, "");
        if (!compact) return 0;
        if (!/^[+-]?\d+(?:[+-]\d+)*[+-]?$/.test(compact)) {
          return null;
        }

        const completeExpression = compact.replace(/[+-]$/, "");
        return (completeExpression.match(/[+-]?\d+/g) || []).reduce(
          (total, term) => total + Number(term),
          0,
        );
      }

      function getPersistedContentFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const encoded = params.get(URL_STATE_KEY);
        if (!encoded) {
          return;
        }

        try {
          return decodeContentFromUrl(encoded);
        } catch {
          return;
        }
      }

      function setPersistedContentInUrl(content) {
        const params = new URLSearchParams(window.location.search);
        const encoded = encodeContentForUrl(content);
        params.set(URL_STATE_KEY, encoded);
        const search = params.toString();
        const nextUrl = `${window.location.pathname}${search ? `?${search}` : ""}${window.location.hash}`;
        window.history.replaceState(null, "", nextUrl);
      }

      class OriginalScorer {
        get validLens() {
          return [1, 2, 3, 4, 5, 6];
        }
        get hasStations() {
          return false;
        }
        stationBonus(_stationsUsed) {
          return 0;
        }
        calcRoutePoints(routes) {
          return routes.reduce(
            (sum, len) => sum + (this.validLens.includes(len) ? ROUTE_POINTS[len] || 0 : 0),
            0,
          );
        }
        calcTotal(p) {
          return (
            this.calcRoutePoints(p.routes) +
            Number(p.destinationPoints || 0) +
            (p.longestRoute ? 10 : 0)
          );
        }
      }

      class EuropeScorer {
        get validLens() {
          return [1, 2, 3, 4, 6, 8];
        }
        get hasStations() {
          return true;
        }
        stationBonus(stationsUsed) {
          return (3 - stationsUsed) * 4;
        }
        calcRoutePoints(routes) {
          return routes.reduce(
            (sum, len) => sum + (this.validLens.includes(len) ? ROUTE_POINTS[len] || 0 : 0),
            0,
          );
        }
        calcTotal(p) {
          return (
            this.calcRoutePoints(p.routes) +
            Number(p.destinationPoints || 0) +
            (p.longestRoute ? 10 : 0) +
            this.stationBonus(p.stationsUsed || 0)
          );
        }
      }

      const SCORERS = { original: new OriginalScorer(), europe: new EuropeScorer() };

      class TTRPlayerCard extends HTMLElement {
        set player(data) {
          this._player = data;
          if (this._colorDot) this.render();
        }

        get player() {
          return this._player;
        }

        set scorer(val) {
          this._scorer = val;
          if (this._colorDot) this.render();
        }

        get scorer() {
          return this._scorer || SCORERS.original;
        }

        connectedCallback() {
          if (!this._isInitialized) {
            this.setupDOM();
            this.setupListeners();
            this._isInitialized = true;
          }
          if (this._player) this.render();
        }

        emit(name, detail) {
          this.dispatchEvent(
            new CustomEvent(name, {
              bubbles: true,
              detail,
            }),
          );
        }

        setupDOM() {
          this.classList.add("player-card");
          this.innerHTML = `
            <div class="player-header">
              <div class="player-color-dot"></div>
              <input class="player-name-input" value="" placeholder="Player name">
              <span class="player-total">0</span>
              <button class="btn-remove-player" type="button" title="Remove player">✕</button>
            </div>

            <div class="score-section">
              <div class="score-section-title">Routes Claimed</div>
              <div class="routes-list">
                ${[1, 2, 3, 4, 5, 6, 8]
                  .map(
                    (len) => `
                      <div class="route-row" data-route-edition="${len === 5 ? "original" : len === 8 ? "europe" : "both"}">
                        <span class="route-len-badge" aria-hidden="true">${len}</span>
                        <span class="route-cars" aria-hidden="true">${"<i></i>".repeat(len)}</span>
                        <span class="route-pts"><span class="sr-only">${len} car route: </span><strong>${ROUTE_POINTS[len]} pt${ROUTE_POINTS[len] > 1 ? "s" : ""}</strong></span>
                        <div class="route-counter">
                          <button class="route-adjust" type="button" data-route-len="${len}" data-route-delta="-1" disabled>-</button>
                          <span class="route-count" data-route-len="${len}">0</span>
                          <button class="route-adjust" type="button" data-route-len="${len}" data-route-delta="1">+</button>
                        </div>
                      </div>
                    `,
                  )
                  .join("")}
              </div>
            </div>

            <hr class="section-divider">

            <div class="score-section">
              <div class="special-scores">
                <div class="special-field">
                  <label>Destination Tickets (net)</label>
                  <div class="destination-entry">
                    <input type="text" inputmode="numeric" enterkeyhint="done" class="special-input dest-input" value="0" placeholder="0" aria-label="Destination ticket points or calculation" autocomplete="off">
                    <button type="button" class="expression-operator" data-expression-operator="−" aria-label="Subtract">−</button>
                    <button type="button" class="expression-operator" data-expression-operator="+" aria-label="Add">+</button>
                  </div>
                </div>
                <div class="special-field">
                  <label>Longest Route +10</label>
                  <button type="button" class="special-input longest-select" aria-pressed="false">No</button>
                </div>
              </div>
            </div>

            <hr class="section-divider station-divider" style="display:none">

            <div class="score-section station-section" style="display:none">
              <div class="special-scores">
                <div class="special-field">
                  <label>Stations Used</label>
                  <div class="station-control">
                    <button class="route-adjust station-dec" type="button">-</button>
                    <span class="station-count">0/3</span>
                    <button class="route-adjust station-inc" type="button">+</button>
                  </div>
                </div>
                <div class="special-field">
                  <label>Station Bonus</label>
                  <span class="station-pts">+12 pts</span>
                </div>
              </div>
            </div>

            <div class="score-breakdown"></div>
          `;

          this._colorDot = this.querySelector(".player-color-dot");
          this._nameInput = this.querySelector(".player-name-input");
          this._totalEl = this.querySelector(".player-total");
          this._routesList = this.querySelector(".routes-list");
          this._destInput = this.querySelector(".dest-input");
          this._longestSelect = this.querySelector(".longest-select");
          this._breakdownEl = this.querySelector(".score-breakdown");
          this._stationDivider = this.querySelector(".station-divider");
          this._stationSection = this.querySelector(".station-section");
          this._stationCount = this.querySelector(".station-count");
          this._stationPts = this.querySelector(".station-pts");

          this._routeRefs = {};
          for (const len of [1, 2, 3, 4, 5, 6, 8]) {
            this._routeRefs[len] = {
              count: this.querySelector(`.route-count[data-route-len="${len}"]`),
              minus: this.querySelector(
                `.route-adjust[data-route-len="${len}"][data-route-delta="-1"]`,
              ),
              plus: this.querySelector(
                `.route-adjust[data-route-len="${len}"][data-route-delta="1"]`,
              ),
            };
          }
        }

        setupListeners() {
          this._nameInput.addEventListener("input", (event) => {
            this.emit("name-change", {
              id: this._player.id,
              name: event.target.value,
            });
          });

          this.querySelector(".btn-remove-player").addEventListener("click", () => {
            this.emit("remove-player", { id: this._player.id });
          });

          this.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-route-delta]");
            if (!btn) return;
            this.emit("route-count-change", {
              id: this._player.id,
              len: Number(btn.dataset.routeLen),
              delta: Number(btn.dataset.routeDelta),
            });
          });

          this._destInput.addEventListener("input", (event) => {
            const destinationPoints = calculateDestinationPoints(event.target.value);
            event.target.setAttribute("aria-invalid", String(destinationPoints === null));
            if (destinationPoints === null) return;

            this._player.destinationPoints = destinationPoints;
            this.updateScoreDisplay();
            this.emit("destination-change", {
              id: this._player.id,
              destinationPoints,
            });
          });

          this._destInput.addEventListener("blur", () => {
            this._destInput.value = String(this._player.destinationPoints || 0);
            this._destInput.setAttribute("aria-invalid", "false");
          });

          this.querySelectorAll("[data-expression-operator]").forEach((button) => {
            button.addEventListener("pointerdown", (event) => {
              event.preventDefault();
            });
            button.addEventListener("click", () => {
              const operator = button.dataset.expressionOperator === "−" ? "-" : "+";
              const start = this._destInput.selectionStart ?? this._destInput.value.length;
              const end = this._destInput.selectionEnd ?? start;
              const value = this._destInput.value;
              const replaceStart = start > 0 && /[+-]/.test(value[start - 1]) ? start - 1 : start;
              this._destInput.setRangeText(operator, replaceStart, end, "end");
              this._destInput.dispatchEvent(new Event("input", { bubbles: true }));
              this._destInput.focus();
            });
          });

          this._longestSelect.addEventListener("click", () => {
            const longestRoute = !this._player.longestRoute;
            this._player.longestRoute = longestRoute;
            this.updateScoreDisplay();
            this.emit("longest-route-change", {
              id: this._player.id,
              longestRoute,
            });
          });

          this.addEventListener("click", (e) => {
            if (!this._player) return;
            const current = this._player.stationsUsed || 0;
            if (e.target.closest(".station-dec") && current > 0) {
              this.emit("station-count-change", {
                playerId: this._player.id,
                stationsUsed: current - 1,
              });
            } else if (e.target.closest(".station-inc") && current < 3) {
              this.emit("station-count-change", {
                playerId: this._player.id,
                stationsUsed: current + 1,
              });
            }
          });
        }

        render() {
          if (!this._player) return;

          const p = this._player;
          const scorer = this.scorer;
          const routePts = scorer.calcRoutePoints(p.routes);
          const total = scorer.calcTotal(p);
          const destinationPoints = Number(p.destinationPoints || 0);
          const stationsUsed = p.stationsUsed || 0;
          const stationBonus = scorer.stationBonus(stationsUsed);

          this._colorDot.style.background = p.color;
          this.style.setProperty("--player-color", p.color);

          if (document.activeElement !== this._nameInput) {
            this._nameInput.value = p.name;
          }

          this._totalEl.textContent = String(total);

          for (const len of [1, 2, 3, 4, 5, 6, 8]) {
            const ref = this._routeRefs[len];
            const active = scorer.validLens.includes(len);
            const row = ref.count.closest(".route-row");
            row.classList.toggle("inactive", !active);
            const count = p.routes.filter((r) => r === len).length;
            row.classList.toggle("claimed", count > 0);
            ref.count.textContent = String(count);
            ref.minus.disabled = !active || count === 0;
            ref.plus.disabled = !active;
          }

          if (document.activeElement !== this._destInput) {
            this._destInput.value = destinationPoints;
          }

          this._longestSelect.textContent = p.longestRoute ? "Yes (+10)" : "No";
          this._longestSelect.setAttribute("aria-pressed", String(p.longestRoute));

          const display = scorer.hasStations ? "" : "none";
          this._stationDivider.style.display = display;
          this._stationSection.style.display = display;
          if (scorer.hasStations) {
            this._stationCount.textContent = `${stationsUsed}/3`;
            this._stationPts.textContent = `+${stationBonus} pts`;
          }

          const breakdownStation = scorer.hasStations ? ` · Stations: +${stationBonus}` : "";
          this._breakdownEl.innerHTML = `Routes: ${routePts} · Tickets: ${destinationPoints > 0 ? "+" : ""}${destinationPoints} · Longest: ${p.longestRoute ? "+10" : "0"}${breakdownStation} = <strong>${total} pts</strong>`;
        }

        updateScoreDisplay() {
          if (!this._player) return;

          const scorer = this.scorer;
          const routePts = scorer.calcRoutePoints(this._player.routes);
          const total = scorer.calcTotal(this._player);
          const destinationPoints = Number(this._player.destinationPoints || 0);
          const stationBonus = scorer.stationBonus(this._player.stationsUsed || 0);

          this._totalEl.textContent = String(total);
          this._longestSelect.textContent = this._player.longestRoute ? "Yes (+10)" : "No";
          this._longestSelect.setAttribute("aria-pressed", String(this._player.longestRoute));
          const breakdownStation = scorer.hasStations ? ` · Stations: +${stationBonus}` : "";
          this._breakdownEl.innerHTML = `Routes: ${routePts} · Tickets: ${destinationPoints > 0 ? "+" : ""}${destinationPoints} · Longest: ${this._player.longestRoute ? "+10" : "0"}${breakdownStation} = <strong>${total} pts</strong>`;
        }
      }

      class TTRScoreboard extends HTMLElement {
        connectedCallback() {
          this.setupDOM();
        }

        setupDOM() {
          this.className = "scoreboard";
          this.innerHTML = `<h2>Standings</h2><div class="scoreboard-rows"></div>`;
          this._rowsContainer = this.querySelector(".scoreboard-rows");
        }

        set players(data) {
          this._players = data;
          if (this._rowsContainer) this.render();
        }

        set scorer(val) {
          this._scorer = val;
          if (this._rowsContainer) this.render();
        }

        render() {
          const players = this._players || [];
          const scorer = this._scorer || SCORERS.original;
          if (players.length === 0) {
            this.style.display = "none";
            return;
          }

          this.style.display = "block";
          if (!this._rowsContainer) this.setupDOM();

          const sorted = [...players].sort((a, b) => scorer.calcTotal(b) - scorer.calcTotal(a));
          const existing = new Map();
          for (const row of this._rowsContainer.children) {
            existing.set(row.dataset.playerId, row);
          }

          const fragment = document.createDocumentFragment();
          sorted.forEach((p, i) => {
            const id = p.name;
            let row = existing.get(id);
            if (!row) {
              row = document.createElement("div");
              row.dataset.playerId = id;
              row._rankEl = document.createElement("span");
              row._rankEl.className = "rank";
              row._dotEl = document.createElement("div");
              row._dotEl.className = "player-color-dot";
              row._nameEl = document.createElement("span");
              row._nameEl.className = "sb-name";
              row._detailsEl = document.createElement("span");
              row._detailsEl.className = "sb-details";
              row._scoreEl = document.createElement("span");
              row._scoreEl.className = "sb-score";
              row.append(row._rankEl, row._dotEl, row._nameEl, row._detailsEl, row._scoreEl);
            }
            row.className = `scoreboard-row rank-${i + 1}`;
            row._rankEl.textContent = i + 1;
            row._dotEl.style.background = p.color;
            row._nameEl.textContent = p.name;
            const stationPart = scorer.hasStations
              ? `+${scorer.stationBonus(p.stationsUsed || 0)}st`
              : "";
            row._detailsEl.textContent = `${p.routes.length} routes · ${scorer.calcRoutePoints(p.routes)}+${p.destinationPoints || 0}${p.longestRoute ? "+10" : ""}${stationPart}`;
            row._scoreEl.textContent = scorer.calcTotal(p);
            fragment.appendChild(row);
          });

          this._rowsContainer.replaceChildren(fragment);
        }
      }

      class TTRScoreApp extends HTMLElement {
        constructor() {
          super();
          this.store = createStore()
            .setValuesSchema(VALUES_SCHEMA)
            .setTablesSchema(TABLES_SCHEMA)
            .setValues({
              nextPlayerId: 1,
              nextRouteId: 1,
            });
          this.persister = null;
          this.loadedFromUrl = false;
        }

        connectedCallback() {
          this._ac = new AbortController();
          const opts = { signal: this._ac.signal };
          this.renderShell();
          this.addEventListener(
            "name-change",
            (event) => {
              if (this.store.hasRow("players", event.detail.id)) {
                this.store.setCell("players", event.detail.id, "name", event.detail.name);
                this.updateScoreboard();
              }
            },
            opts,
          );

          this.addEventListener(
            "remove-player",
            (event) => {
              this.store.transaction(() => {
                this.store.delRow("players", event.detail.id);
                const routes = this.store.getTable("routes") || {};
                Object.entries(routes).forEach(([routeId, route]) => {
                  if (String(route.playerId) === event.detail.id) {
                    this.store.delRow("routes", routeId);
                  }
                });
              });
              this.renderPlayers();
            },
            opts,
          );

          this.addEventListener(
            "route-count-change",
            (event) => {
              if (!this.store.hasRow("players", event.detail.id)) {
                return;
              }

              if (event.detail.delta > 0) {
                const routeId = String(this.store.getValue("nextRouteId") || 1);
                const existingRoutes = this.getRoutesForPlayer(event.detail.id);
                this.store.transaction(() => {
                  this.store.setRow("routes", routeId, {
                    playerId: event.detail.id,
                    len: event.detail.len,
                    order: existingRoutes.length,
                  });
                  this.store.setValue("nextRouteId", Number(routeId) + 1);
                });
                this.refreshPlayerCard(event.detail.id);
                return;
              }

              if (event.detail.delta < 0) {
                const routeToRemove = this.getRoutesForPlayer(event.detail.id).find(
                  (route) => route.len === event.detail.len,
                );
                if (routeToRemove) {
                  this.store.delRow("routes", routeToRemove.id);
                  this.refreshPlayerCard(event.detail.id);
                }
              }
            },
            opts,
          );

          this.addEventListener(
            "destination-change",
            (event) => {
              if (this.store.hasRow("players", event.detail.id)) {
                this.store.setCell(
                  "players",
                  event.detail.id,
                  "destinationPoints",
                  event.detail.destinationPoints,
                );
                this.updateScoreboard();
              }
            },
            opts,
          );

          this.addEventListener(
            "longest-route-change",
            (event) => {
              if (this.store.hasRow("players", event.detail.id)) {
                this.store.setCell(
                  "players",
                  event.detail.id,
                  "longestRoute",
                  event.detail.longestRoute,
                );
                this.updateScoreboard();
              }
            },
            opts,
          );

          this.addEventListener(
            "station-count-change",
            (event) => {
              const { playerId, stationsUsed } = event.detail;
              if (this.store.hasRow("players", playerId)) {
                this.store.setCell("players", playerId, "stationsUsed", stationsUsed);
                this.refreshPlayerCard(playerId);
              }
            },
            opts,
          );

          this.initStorePersistence();
        }

        disconnectedCallback() {
          this._ac?.abort();
          if (this.persister) {
            this.persister.destroy();
            this.persister = null;
          }
        }

        async initStorePersistence() {
          this.persister = createCustomPersister(
            this.store,
            async () => {
              const content = getPersistedContentFromUrl();
              this.loadedFromUrl = content != null;
              return content;
            },
            async (getContent) => {
              setPersistedContentInUrl(getContent());
            },
            (listener) => {
              window.addEventListener("popstate", listener);
            },
            (listener) => {
              window.removeEventListener("popstate", listener);
            },
          );

          await this.persister.load();
          this.persister.startAutoSave();
          this.persister.startAutoLoad();

          if (!this.loadedFromUrl) {
            this.addPlayer();
            this.addPlayer();
            return;
          }

          this.syncEdition();
        }

        renderShell() {
          this.innerHTML = `
            <header>
              <div class="header-title">
                <span class="train" aria-hidden="true"><i></i><i></i><i></i></span>
                <h1>Ticket to Ride</h1>
                <p>Score Tracker</p>
              </div>
              <div class="edition-toggle">
                <button class="edition-btn" type="button" id="editionBtn" aria-label="Game edition">
                  <span data-edition="original" class="active">Original</span><span data-edition="europe">Europe</span>
                </button>
              </div>
            </header>

            <div class="controls">
              <button class="btn btn-primary" type="button" id="addPlayerBtn">+ Add Player</button>
              <button class="btn btn-ghost" type="button" id="resetBtn">Reset All</button>
            </div>

            <main>
              <div class="players-grid" id="playersGrid"></div>
              <ttr-scoreboard id="scoreboard"></ttr-scoreboard>
            </main>
          `;

          this.querySelector("#addPlayerBtn")?.addEventListener(
            "click",
            () => {
              this.addPlayer();
            },
            { signal: this._ac.signal },
          );

          this.querySelector("#resetBtn")?.addEventListener(
            "click",
            () => {
              this.resetAll();
            },
            { signal: this._ac.signal },
          );

          this.querySelector("#editionBtn")?.addEventListener(
            "click",
            () => {
              const current = this.store.getValue("edition") || "original";
              this.store.setValue("edition", current === "original" ? "europe" : "original");
              this.syncEdition();
            },
            { signal: this._ac.signal },
          );
        }

        syncEdition() {
          const edition = this.store.getValue("edition") || "original";
          this.querySelectorAll("#editionBtn span").forEach((span) => {
            span.classList.toggle("active", span.dataset.edition === edition);
          });
          this.renderPlayers();
        }

        getPlayers() {
          const playersTable = this.store.getTable("players") || {};
          const players = Object.entries(playersTable).map(([id, row]) => {
            const routes = this.getRoutesForPlayer(id).map((route) => route.len);
            return {
              id,
              name: String(row.name || "Player"),
              color: String(row.color || PLAYER_COLORS[0]),
              destinationPoints: Number(row.destinationPoints || 0),
              longestRoute: Boolean(row.longestRoute),
              stationsUsed: Number(row.stationsUsed || 0),
              routes,
              order: Number(row.order || 0),
            };
          });

          players.sort((a, b) => a.order - b.order || Number(a.id) - Number(b.id));
          return players;
        }

        getRoutesForPlayer(playerId) {
          const routes = this.store.getTable("routes") || {};
          const playerRoutes = Object.entries(routes)
            .filter(([, route]) => String(route.playerId) === String(playerId))
            .map(([id, route]) => ({
              id,
              len: Number(route.len || 0),
              order: Number(route.order || 0),
            }));

          playerRoutes.sort((a, b) => a.order - b.order || Number(a.id) - Number(b.id));
          return playerRoutes;
        }

        addPlayer() {
          const id = String(this.store.getValue("nextPlayerId") || 1);
          const playerCount = Object.keys(this.store.getTable("players") || {}).length;
          const colorIndex = playerCount % PLAYER_COLORS.length;
          this.store.transaction(() => {
            this.store.setRow("players", id, {
              name: `Player ${playerCount + 1}`,
              color: PLAYER_COLORS[colorIndex],
              destinationPoints: 0,
              longestRoute: false,
              stationsUsed: 0,
              order: playerCount,
            });
            this.store.setValue("nextPlayerId", Number(id) + 1);
          });
          this.renderPlayers();
        }

        refreshPlayerCard(playerId) {
          const player = this.getPlayers().find((entry) => String(entry.id) === String(playerId));
          if (!player) {
            this.renderPlayers();
            return;
          }

          const card = Array.from(this.querySelectorAll("ttr-player-card")).find(
            (entry) => entry.dataset.playerId === String(playerId),
          );

          if (!card) {
            this.renderPlayers();
            return;
          }

          card.player = player;
          card.scorer = SCORERS[this.store.getValue("edition") || "original"];
          card.dataset.playerId = player.id;
          this.updateScoreboard();
        }

        resetAll() {
          if (confirm("Reset all scores? Player names will be kept.")) {
            this.store.transaction(() => {
              const players = this.store.getTable("players") || {};
              Object.keys(players).forEach((id) => {
                this.store.setCell("players", id, "destinationPoints", 0);
                this.store.setCell("players", id, "longestRoute", false);
                this.store.setCell("players", id, "stationsUsed", 0);
              });

              const routes = this.store.getTable("routes") || {};
              Object.keys(routes).forEach((routeId) => {
                this.store.delRow("routes", routeId);
              });
            });
            this.renderPlayers();
          }
        }

        renderPlayers() {
          const grid = this.querySelector("#playersGrid");
          if (!grid) return;

          const players = this.getPlayers();
          const edition = this.store.getValue("edition") || "original";

          if (players.length === 0) {
            grid.innerHTML =
              '<div class="empty-state">All aboard — add players to begin scoring</div>';
            this.updateScoreboard();
            return;
          }

          const existing = new Map(
            Array.from(grid.querySelectorAll("ttr-player-card")).map((el) => [
              el.dataset.playerId,
              el,
            ]),
          );

          const fragment = document.createDocumentFragment();
          for (const player of players) {
            let card = existing.get(player.id);
            if (!card) {
              card = document.createElement("ttr-player-card");
              card.dataset.playerId = player.id;
            }
            card.player = player;
            card.scorer = SCORERS[edition];
            fragment.appendChild(card);
          }
          grid.replaceChildren(fragment);

          this.updateScoreboard();
        }

        updateScoreboard() {
          const scoreboard = this.querySelector("#scoreboard");
          if (scoreboard) {
            scoreboard.scorer = SCORERS[this.store.getValue("edition") || "original"];
            scoreboard.players = this.getPlayers();
          }
        }
      }

      customElements.define("ttr-player-card", TTRPlayerCard);
      customElements.define("ttr-scoreboard", TTRScoreboard);
      customElements.define("ttr-score-app", TTRScoreApp);
    </script>
  </body>
</html>

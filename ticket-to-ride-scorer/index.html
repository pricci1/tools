<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket to Ride — Score Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f5efe3;
        --dark: #1a1208;
        --brown: #5c3d1e;
        --rust: #c0392b;
        --gold: #d4a017;
        --green: #27623a;
        --card-bg: #fdf8f0;
        --border: #c9b08a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--cream);
        color: var(--dark);
        font-family: "Crimson Pro", serif;
        min-height: 100vh;
        background-image:
          radial-gradient(
            ellipse at 20% 80%,
            rgba(92, 61, 30, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(192, 57, 43, 0.06) 0%,
            transparent 50%
          );
      }

      header {
        text-align: center;
        padding: 2rem 1rem 1rem;
        border-bottom: 2px solid var(--border);
        background: var(--card-bg);
        box-shadow: 0 2px 12px rgba(92, 61, 30, 0.1);
        position: relative;
        overflow: hidden;
      }

      header::before {
        content: "🚂";
        position: absolute;
        font-size: 8rem;
        opacity: 0.04;
        right: 5%;
        top: -10px;
        transform: rotate(-10deg);
      }

      header h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.8rem, 5vw, 3rem);
        font-weight: 900;
        letter-spacing: 0.02em;
        color: var(--brown);
      }

      header p {
        font-style: italic;
        color: var(--rust);
        font-size: 1.1rem;
        margin-top: 0.25rem;
      }

      .controls {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        padding: 1.25rem 1rem;
        flex-wrap: wrap;
        background: var(--dark);
      }

      .btn {
        font-family: "Crimson Pro", serif;
        font-size: 1rem;
        padding: 0.5rem 1.25rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.03em;
      }

      .btn-primary {
        background: var(--gold);
        color: var(--dark);
        font-weight: 400;
      }
      .btn-primary:hover {
        background: #e6b020;
        transform: translateY(-1px);
      }

      .btn-danger {
        background: var(--rust);
        color: white;
      }
      .btn-danger:hover {
        background: #a93226;
      }

      .btn-ghost {
        background: transparent;
        color: var(--cream);
        border: 1px solid rgba(245, 239, 227, 0.3);
      }
      .btn-ghost:hover {
        background: rgba(245, 239, 227, 0.1);
      }

      .btn-sm {
        font-size: 0.85rem;
        padding: 0.3rem 0.75rem;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem 1rem 4rem;
      }

      /* Players grid */
      .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.25rem;
        margin-bottom: 2rem;
      }

      .player-card {
        background: var(--card-bg);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(92, 61, 30, 0.08);
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .player-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--border);
      }

      .player-color-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.15);
        flex-shrink: 0;
      }

      .player-name-input {
        font-family: "Playfair Display", serif;
        font-size: 1.15rem;
        font-weight: 700;
        background: transparent;
        border: none;
        border-bottom: 1px dashed transparent;
        color: var(--dark);
        flex: 1;
        min-width: 0;
        padding: 2px 0;
        transition: border-color 0.2s;
      }
      .player-name-input:focus {
        outline: none;
        border-bottom-color: var(--gold);
      }

      .player-total {
        font-family: "Playfair Display", serif;
        font-size: 1.6rem;
        font-weight: 900;
        color: var(--rust);
        min-width: 48px;
        text-align: right;
      }

      .btn-remove-player {
        background: none;
        border: none;
        color: var(--border);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 2px 4px;
        transition: color 0.15s;
        line-height: 1;
      }
      .btn-remove-player:hover {
        color: var(--rust);
      }

      .score-section {
        padding: 0.75rem 1rem;
      }

      .score-section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--brown);
        margin-bottom: 0.5rem;
        font-style: italic;
      }

      /* Route rows */
      .routes-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .route-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(92, 61, 30, 0.04);
        border-radius: 4px;
        padding: 4px 6px;
      }

      .route-row.inactive {
        opacity: 0.35;
        pointer-events: none;
      }

      .route-len-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: var(--cream);
        color: var(--brown);
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: default;
        transition: all 0.12s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .route-pts {
        font-size: 0.8rem;
        color: #666;
        font-style: italic;
        flex: 1;
      }

      .route-pts strong {
        color: var(--green);
        font-style: normal;
      }

      .route-counter {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .route-count {
        min-width: 2ch;
        text-align: center;
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        color: var(--dark);
      }

      .route-adjust {
        width: 22px;
        height: 22px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--cream);
        color: var(--brown);
        cursor: pointer;
        line-height: 1;
        font-size: 1rem;
      }

      .route-adjust:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--dark);
      }

      .route-adjust:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Special scores */
      .special-scores {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .special-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .special-field label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--brown);
        font-style: italic;
      }

      .special-input {
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        width: 100%;
        padding: 4px 8px;
        border: 1.5px solid var(--border);
        border-radius: 4px;
        background: var(--cream);
        color: var(--dark);
        text-align: center;
      }
      .special-input:focus {
        outline: none;
        border-color: var(--gold);
      }

      /* Divider */
      .section-divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 0.6rem 0;
      }

      /* Score breakdown */
      .score-breakdown {
        font-size: 0.8rem;
        color: #777;
        font-style: italic;
        padding: 0 1rem 0.6rem;
      }

      /* Scoreboard */
      .scoreboard {
        background: var(--dark);
        color: var(--cream);
        border-radius: 8px;
        padding: 1.5rem;
        margin-top: 2rem;
      }

      .scoreboard h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.4rem;
        color: var(--gold);
        margin-bottom: 1rem;
        border-bottom: 1px solid rgba(212, 160, 23, 0.3);
        padding-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      .scoreboard-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(245, 239, 227, 0.08);
        transition: all 0.3s;
      }

      .rank {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        font-weight: 900;
        color: rgba(212, 160, 23, 0.4);
        min-width: 2rem;
      }

      .scoreboard-row.rank-1 .rank {
        color: var(--gold);
      }
      .scoreboard-row.rank-1 {
        background: rgba(212, 160, 23, 0.08);
        border-radius: 4px;
        padding-left: 0.5rem;
      }

      .sb-name {
        flex: 1;
        font-size: 1.1rem;
        font-weight: 300;
      }

      .sb-details {
        font-size: 0.78rem;
        color: rgba(245, 239, 227, 0.45);
        font-style: italic;
      }

      .sb-score {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        font-weight: 900;
        color: var(--rust);
      }

      .scoreboard-row.rank-1 .sb-score {
        color: var(--gold);
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--brown);
        font-style: italic;
        opacity: 0.6;
      }

      /* Route points table */
      .points-ref {
        background: var(--card-bg);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-top: 1.5rem;
        font-size: 0.9rem;
      }

      .points-ref h3 {
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        color: var(--brown);
        margin-bottom: 0.5rem;
      }

      .ref-table {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .ref-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .ref-len {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 1rem;
        color: var(--dark);
        min-width: 1.5rem;
      }

      .ref-pts {
        color: var(--green);
        font-style: italic;
      }

      /* Edition toggle */
      .edition-toggle {
        display: flex;
        gap: 0;
        justify-content: center;
        margin-top: 0.6rem;
      }

      .edition-btn {
        font-family: "Crimson Pro", serif;
        font-size: 0.9rem;
        padding: 0.3rem 1.25rem;
        border: 1.5px solid var(--gold);
        border-radius: 20px;
        background: var(--gold);
        color: var(--dark);
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: all 0.15s;
      }

      .edition-btn:hover {
        background: rgba(212, 160, 23, 0.75);
      }

      /* Station control */
      .station-control {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .station-count {
        min-width: 3ch;
        text-align: center;
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        color: var(--dark);
      }

      .station-pts {
        font-size: 0.8rem;
        color: var(--green);
        font-style: italic;
      }

      @media (max-width: 720px) {
        header {
          padding: 1.5rem 0.85rem 0.9rem;
        }

        .controls {
          padding: 0.85rem;
          gap: 0.6rem;
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .btn,
        .btn-sm {
          min-height: 44px;
          padding: 0.65rem 0.9rem;
          font-size: 1rem;
        }

        main {
          padding: 1rem 0.75rem 3rem;
        }

        .players-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }

        .player-header {
          padding: 0.9rem 0.9rem;
          gap: 0.6rem;
        }

        .player-color-dot {
          width: 20px;
          height: 20px;
        }

        .player-name-input {
          font-size: 1.1rem;
          padding: 0.45rem 0;
        }

        .btn-remove-player {
          width: 44px;
          height: 44px;
          font-size: 1.35rem;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          margin-right: -0.2rem;
        }

        .score-section {
          padding: 0.8rem 0.9rem;
        }

        .route-row {
          gap: 0.7rem;
          padding: 0.5rem 0.55rem;
        }

        .route-len-btn {
          width: 34px;
          height: 34px;
          font-size: 1rem;
        }

        .route-pts {
          font-size: 0.9rem;
        }

        .route-counter {
          gap: 0.4rem;
        }

        .route-adjust {
          width: 34px;
          height: 34px;
          font-size: 1.2rem;
        }

        .special-scores {
          grid-template-columns: 1fr;
          gap: 0.55rem;
        }

        .special-field {
          gap: 0.25rem;
        }

        .special-input {
          min-height: 44px;
          padding: 0.55rem 0.65rem;
          font-size: 1rem;
        }

        .scoreboard {
          padding: 1rem 0.9rem;
        }

        .scoreboard-row {
          gap: 0.75rem;
          padding: 0.65rem 0;
        }

        .sb-name {
          font-size: 1rem;
        }

        .sb-score {
          font-size: 1.6rem;
        }

        .points-ref {
          padding: 0.85rem 0.9rem;
        }

        .ref-table {
          gap: 0.8rem 1.2rem;
        }
      }

      @media (max-width: 420px) {
        .controls {
          grid-template-columns: 1fr;
        }

        .route-row {
          gap: 0.55rem;
        }

        .route-pts {
          font-size: 0.82rem;
        }
      }
    </style>
  </head>
  <body>
    <ttr-score-app></ttr-score-app>

    <script type="importmap">
      {
        "imports": {
          "tinybase": "https://esm.sh/tinybase@7.3.4",
          "tinybase/": "https://esm.sh/tinybase@7.3.4/"
        }
      }
    </script>

    <script type="module">
      import { createStore } from "tinybase";
      import { createCustomPersister } from "tinybase/persisters";

      const ROUTE_POINTS = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 10, 6: 15, 8: 21 };
      const PLAYER_COLORS = [
        "#2980b9",
        "#e74c3c",
        "#2c3e50",
        "#f1c40f",
        "#27ae60",
        "#ecf0f1",
      ];
      const URL_STATE_KEY = "s";
      const VALUES_SCHEMA = {
        nextPlayerId: { type: "number", default: 1 },
        nextRouteId: { type: "number", default: 1 },
        edition: { type: "string", default: "original" },
      };
      const TABLES_SCHEMA = {
        players: {
          name: { type: "string", default: "Player" },
          color: { type: "string", default: PLAYER_COLORS[0] },
          destinationPoints: { type: "number", default: 0 },
          longestRoute: { type: "boolean", default: false },
          stationsUsed: { type: "number", default: 0 },
          order: { type: "number", default: 0 },
        },
        routes: {
          playerId: { type: "string" },
          len: { type: "number", default: 1 },
          order: { type: "number", default: 0 },
        },
      };

      function encodeContentForUrl(content) {
        const json = JSON.stringify(content);
        const bytes = new TextEncoder().encode(json);
        let binary = "";
        bytes.forEach((byte) => {
          binary += String.fromCharCode(byte);
        });
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function decodeContentFromUrl(encoded) {
        const normalized = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - (normalized.length % 4 || 4)) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        const json = new TextDecoder().decode(bytes);
        return JSON.parse(json);
      }

      function getPersistedContentFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const encoded = params.get(URL_STATE_KEY);
        if (!encoded) {
          return;
        }

        try {
          return decodeContentFromUrl(encoded);
        } catch {
          return;
        }
      }

      function setPersistedContentInUrl(content) {
        const params = new URLSearchParams(window.location.search);
        const encoded = encodeContentForUrl(content);
        params.set(URL_STATE_KEY, encoded);
        const search = params.toString();
        const nextUrl = `${window.location.pathname}${search ? `?${search}` : ""}${window.location.hash}`;
        window.history.replaceState(null, "", nextUrl);
      }

      class OriginalScorer {
        get validLens() { return [1, 2, 3, 4, 5, 6]; }
        get hasStations() { return false; }
        stationBonus(_stationsUsed) { return 0; }
        calcRoutePoints(routes) {
          return routes.reduce((sum, len) => sum + (this.validLens.includes(len) ? (ROUTE_POINTS[len] || 0) : 0), 0);
        }
        calcTotal(p) {
          return this.calcRoutePoints(p.routes) + Number(p.destinationPoints || 0) + (p.longestRoute ? 10 : 0);
        }
      }

      class EuropeScorer {
        get validLens() { return [1, 2, 3, 4, 6, 8]; }
        get hasStations() { return true; }
        stationBonus(stationsUsed) { return (3 - stationsUsed) * 4; }
        calcRoutePoints(routes) {
          return routes.reduce((sum, len) => sum + (this.validLens.includes(len) ? (ROUTE_POINTS[len] || 0) : 0), 0);
        }
        calcTotal(p) {
          return this.calcRoutePoints(p.routes) + Number(p.destinationPoints || 0) + (p.longestRoute ? 10 : 0) + this.stationBonus(p.stationsUsed || 0);
        }
      }

      const SCORERS = { original: new OriginalScorer(), europe: new EuropeScorer() };


      class TTRPlayerCard extends HTMLElement {
        set player(data) {
          this._player = data;
          if (this._colorDot) this.render();
        }

        get player() {
          return this._player;
        }

        set scorer(val) {
          this._scorer = val;
          if (this._colorDot) this.render();
        }

        get scorer() {
          return this._scorer || SCORERS.original;
        }

        connectedCallback() {
          if (!this._isInitialized) {
            this.setupDOM();
            this.setupListeners();
            this._isInitialized = true;
          }
          if (this._player) this.render();
        }

        emit(name, detail) {
          this.dispatchEvent(
            new CustomEvent(name, {
              bubbles: true,
              detail,
            }),
          );
        }

        setupDOM() {
          this.classList.add("player-card");
          this.innerHTML = `
            <div class="player-header">
              <div class="player-color-dot"></div>
              <input class="player-name-input" value="" placeholder="Player name">
              <span class="player-total">0</span>
              <button class="btn-remove-player" type="button" title="Remove player">✕</button>
            </div>

            <div class="score-section">
              <div class="score-section-title">Routes Claimed</div>
              <div class="routes-list">
                ${[1, 2, 3, 4, 5, 6, 8]
                  .map(
                    (len) => `
                      <div class="route-row" data-route-edition="${len === 5 ? "original" : len === 8 ? "europe" : "both"}">
                        <span class="route-len-btn">${len}</span>
                        <span class="route-pts">${len} cars → <strong>${ROUTE_POINTS[len]} pts</strong></span>
                        <div class="route-counter">
                          <button class="route-adjust" type="button" data-route-len="${len}" data-route-delta="-1" disabled>-</button>
                          <span class="route-count" data-route-len="${len}">0</span>
                          <button class="route-adjust" type="button" data-route-len="${len}" data-route-delta="1">+</button>
                        </div>
                      </div>
                    `,
                  )
                  .join("")}
              </div>
            </div>

            <hr class="section-divider">

            <div class="score-section">
              <div class="special-scores">
                <div class="special-field">
                  <label>Destination Tickets (net)</label>
                  <input type="number" class="special-input dest-input" value="0" placeholder="0">
                </div>
                <div class="special-field">
                  <label>Longest Route +10</label>
                  <select class="special-input longest-select">
                    <option value="false">No</option>
                    <option value="true">Yes (+10)</option>
                  </select>
                </div>
              </div>
            </div>

            <hr class="section-divider station-divider" style="display:none">

            <div class="score-section station-section" style="display:none">
              <div class="special-scores">
                <div class="special-field">
                  <label>Stations Used</label>
                  <div class="station-control">
                    <button class="route-adjust station-dec" type="button">-</button>
                    <span class="station-count">0/3</span>
                    <button class="route-adjust station-inc" type="button">+</button>
                  </div>
                </div>
                <div class="special-field">
                  <label>Station Bonus</label>
                  <span class="station-pts">+12 pts</span>
                </div>
              </div>
            </div>

            <div class="score-breakdown"></div>
          `;

          this._colorDot = this.querySelector(".player-color-dot");
          this._nameInput = this.querySelector(".player-name-input");
          this._totalEl = this.querySelector(".player-total");
          this._routesList = this.querySelector(".routes-list");
          this._destInput = this.querySelector(".dest-input");
          this._longestSelect = this.querySelector(".longest-select");
          this._breakdownEl = this.querySelector(".score-breakdown");
          this._stationDivider = this.querySelector(".station-divider");
          this._stationSection = this.querySelector(".station-section");
          this._stationCount = this.querySelector(".station-count");
          this._stationPts = this.querySelector(".station-pts");

          this._routeRefs = {};
          for (const len of [1, 2, 3, 4, 5, 6, 8]) {
            this._routeRefs[len] = {
              count: this.querySelector(`.route-count[data-route-len="${len}"]`),
              minus: this.querySelector(`.route-adjust[data-route-len="${len}"][data-route-delta="-1"]`),
              plus: this.querySelector(`.route-adjust[data-route-len="${len}"][data-route-delta="1"]`),
            };
          }
        }

        setupListeners() {
          this._nameInput.addEventListener("input", (event) => {
            this.emit("name-change", {
              id: this._player.id,
              name: event.target.value,
            });
          });

          this.querySelector(".btn-remove-player").addEventListener("click", () => {
            this.emit("remove-player", { id: this._player.id });
          });

          this.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-route-delta]");
            if (!btn) return;
            this.emit("route-count-change", {
              id: this._player.id,
              len: Number(btn.dataset.routeLen),
              delta: Number(btn.dataset.routeDelta),
            });
          });

          this._destInput.addEventListener("input", (event) => {
            const destinationPoints = Number(event.target.value) || 0;
            this._player.destinationPoints = destinationPoints;
            this.updateScoreDisplay();
            this.emit("destination-change", {
              id: this._player.id,
              destinationPoints,
            });
          });

          this._longestSelect.addEventListener("change", (event) => {
            const longestRoute = event.target.value === "true";
            this._player.longestRoute = longestRoute;
            this.updateScoreDisplay();
            this.emit("longest-route-change", {
              id: this._player.id,
              longestRoute,
            });
          });

          this.addEventListener("click", (e) => {
            if (!this._player) return;
            const current = this._player.stationsUsed || 0;
            if (e.target.closest(".station-dec") && current > 0) {
              this.emit("station-count-change", { playerId: this._player.id, stationsUsed: current - 1 });
            } else if (e.target.closest(".station-inc") && current < 3) {
              this.emit("station-count-change", { playerId: this._player.id, stationsUsed: current + 1 });
            }
          });
        }

        render() {
          if (!this._player) return;

          const p = this._player;
          const scorer = this.scorer;
          const routePts = scorer.calcRoutePoints(p.routes);
          const total = scorer.calcTotal(p);
          const destinationPoints = Number(p.destinationPoints || 0);
          const stationsUsed = p.stationsUsed || 0;
          const stationBonus = scorer.stationBonus(stationsUsed);

          this._colorDot.style.background = p.color;

          if (document.activeElement !== this._nameInput) {
            this._nameInput.value = p.name;
          }

          this._totalEl.textContent = String(total);

          for (const len of [1, 2, 3, 4, 5, 6, 8]) {
            const ref = this._routeRefs[len];
            const active = scorer.validLens.includes(len);
            const row = ref.count.closest(".route-row");
            row.classList.toggle("inactive", !active);
            const count = p.routes.filter((r) => r === len).length;
            ref.count.textContent = String(count);
            ref.minus.disabled = !active || count === 0;
            ref.plus.disabled = !active;
          }

          if (document.activeElement !== this._destInput) {
            this._destInput.value = destinationPoints;
          }

          if (document.activeElement !== this._longestSelect) {
            this._longestSelect.value = String(p.longestRoute);
          }

          const display = scorer.hasStations ? "" : "none";
          this._stationDivider.style.display = display;
          this._stationSection.style.display = display;
          if (scorer.hasStations) {
            this._stationCount.textContent = `${stationsUsed}/3`;
            this._stationPts.textContent = `+${stationBonus} pts`;
          }

          const breakdownStation = scorer.hasStations ? ` · Stations: +${stationBonus}` : "";
          this._breakdownEl.innerHTML =
            `Routes: ${routePts} · Tickets: ${destinationPoints > 0 ? "+" : ""}${destinationPoints} · Longest: ${p.longestRoute ? "+10" : "0"}${breakdownStation} = <strong>${total} pts</strong>`;
        }

        updateScoreDisplay() {
          if (!this._player) return;

          const scorer = this.scorer;
          const routePts = scorer.calcRoutePoints(this._player.routes);
          const total = scorer.calcTotal(this._player);
          const destinationPoints = Number(this._player.destinationPoints || 0);
          const stationBonus = scorer.stationBonus(this._player.stationsUsed || 0);

          this._totalEl.textContent = String(total);
          const breakdownStation = scorer.hasStations ? ` · Stations: +${stationBonus}` : "";
          this._breakdownEl.innerHTML =
            `Routes: ${routePts} · Tickets: ${destinationPoints > 0 ? "+" : ""}${destinationPoints} · Longest: ${this._player.longestRoute ? "+10" : "0"}${breakdownStation} = <strong>${total} pts</strong>`;
        }
      }

      class TTRScoreboard extends HTMLElement {
        connectedCallback() {
          this.setupDOM();
        }

        setupDOM() {
          this.className = "scoreboard";
          this.innerHTML = `<h2>🏆 Leaderboard</h2><div class="scoreboard-rows"></div>`;
          this._rowsContainer = this.querySelector(".scoreboard-rows");
        }

        set players(data) {
          this._players = data;
          if (this._rowsContainer) this.render();
        }

        set scorer(val) {
          this._scorer = val;
          if (this._rowsContainer) this.render();
        }

        render() {
          const players = this._players || [];
          const scorer = this._scorer || SCORERS.original;
          if (players.length === 0) {
            this.style.display = "none";
            return;
          }

          this.style.display = "block";
          if (!this._rowsContainer) this.setupDOM();

          const sorted = [...players].sort((a, b) => scorer.calcTotal(b) - scorer.calcTotal(a));
          const existing = new Map();
          for (const row of this._rowsContainer.children) {
            existing.set(row.dataset.playerId, row);
          }

          const fragment = document.createDocumentFragment();
          sorted.forEach((p, i) => {
            const id = p.name;
            let row = existing.get(id);
            if (!row) {
              row = document.createElement("div");
              row.dataset.playerId = id;
              row._rankEl = document.createElement("span");
              row._rankEl.className = "rank";
              row._dotEl = document.createElement("div");
              row._dotEl.className = "player-color-dot";
              row._nameEl = document.createElement("span");
              row._nameEl.className = "sb-name";
              row._detailsEl = document.createElement("span");
              row._detailsEl.className = "sb-details";
              row._scoreEl = document.createElement("span");
              row._scoreEl.className = "sb-score";
              row.append(row._rankEl, row._dotEl, row._nameEl, row._detailsEl, row._scoreEl);
            }
            row.className = `scoreboard-row rank-${i + 1}`;
            row._rankEl.textContent = i + 1;
            row._dotEl.style.background = p.color;
            row._nameEl.textContent = p.name;
            const stationPart = scorer.hasStations ? `+${scorer.stationBonus(p.stationsUsed || 0)}st` : "";
            row._detailsEl.textContent = `${p.routes.length} routes · ${scorer.calcRoutePoints(p.routes)}+${p.destinationPoints || 0}${p.longestRoute ? "+10" : ""}${stationPart}`;
            row._scoreEl.textContent = scorer.calcTotal(p);
            fragment.appendChild(row);
          });

          this._rowsContainer.replaceChildren(fragment);
        }
      }

      class TTRScoreApp extends HTMLElement {
        constructor() {
          super();
          this.store = createStore()
            .setValuesSchema(VALUES_SCHEMA)
            .setTablesSchema(TABLES_SCHEMA)
            .setValues({
              nextPlayerId: 1,
              nextRouteId: 1,
            });
          this.persister = null;
          this.loadedFromUrl = false;
        }

        connectedCallback() {
          this._ac = new AbortController();
          const opts = { signal: this._ac.signal };
          this.renderShell();
          this.addEventListener("name-change", (event) => {
            if (this.store.hasRow("players", event.detail.id)) {
              this.store.setCell("players", event.detail.id, "name", event.detail.name);
              this.updateScoreboard();
            }
          }, opts);

          this.addEventListener("remove-player", (event) => {
            this.store.transaction(() => {
              this.store.delRow("players", event.detail.id);
              const routes = this.store.getTable("routes") || {};
              Object.entries(routes).forEach(([routeId, route]) => {
                if (String(route.playerId) === event.detail.id) {
                  this.store.delRow("routes", routeId);
                }
              });
            });
            this.renderPlayers();
          }, opts);

          this.addEventListener("route-count-change", (event) => {
            if (!this.store.hasRow("players", event.detail.id)) {
              return;
            }

            if (event.detail.delta > 0) {
              const routeId = String(this.store.getValue("nextRouteId") || 1);
              const existingRoutes = this.getRoutesForPlayer(event.detail.id);
              this.store.transaction(() => {
                this.store.setRow("routes", routeId, {
                  playerId: event.detail.id,
                  len: event.detail.len,
                  order: existingRoutes.length,
                });
                this.store.setValue("nextRouteId", Number(routeId) + 1);
              });
              this.refreshPlayerCard(event.detail.id);
              return;
            }

            if (event.detail.delta < 0) {
              const routeToRemove = this.getRoutesForPlayer(event.detail.id).find(
                (route) => route.len === event.detail.len,
              );
              if (routeToRemove) {
                this.store.delRow("routes", routeToRemove.id);
                this.refreshPlayerCard(event.detail.id);
              }
            }
          }, opts);

          this.addEventListener("destination-change", (event) => {
            if (this.store.hasRow("players", event.detail.id)) {
              this.store.setCell(
                "players",
                event.detail.id,
                "destinationPoints",
                event.detail.destinationPoints,
              );
              this.updateScoreboard();
            }
          }, opts);

          this.addEventListener("longest-route-change", (event) => {
            if (this.store.hasRow("players", event.detail.id)) {
              this.store.setCell(
                "players",
                event.detail.id,
                "longestRoute",
                event.detail.longestRoute,
              );
              this.updateScoreboard();
            }
          }, opts);

          this.addEventListener("station-count-change", (event) => {
            const { playerId, stationsUsed } = event.detail;
            if (this.store.hasRow("players", playerId)) {
              this.store.setCell("players", playerId, "stationsUsed", stationsUsed);
              this.refreshPlayerCard(playerId);
            }
          }, opts);

          this.initStorePersistence();
        }

        disconnectedCallback() {
          this._ac?.abort();
          if (this.persister) {
            this.persister.destroy();
            this.persister = null;
          }
        }

        async initStorePersistence() {
          this.persister = createCustomPersister(
            this.store,
            async () => {
              const content = getPersistedContentFromUrl();
              this.loadedFromUrl = content != null;
              return content;
            },
            async (getContent) => {
              setPersistedContentInUrl(getContent());
            },
            (listener) => {
              window.addEventListener("popstate", listener);
            },
            (listener) => {
              window.removeEventListener("popstate", listener);
            },
          );

          await this.persister.load();
          this.persister.startAutoSave();
          this.persister.startAutoLoad();

          if (!this.loadedFromUrl) {
            this.addPlayer();
            this.addPlayer();
            return;
          }

          this.syncEdition();
        }

        renderShell() {
          this.innerHTML = `
            <header>
              <h1>Ticket to Ride</h1>
              <p>Score Tracker</p>
              <div class="edition-toggle">
                <button class="edition-btn" type="button" id="editionBtn">Original</button>
              </div>
            </header>

            <div class="controls">
              <button class="btn btn-primary" type="button" id="addPlayerBtn">+ Add Player</button>
              <button class="btn btn-ghost" type="button" id="resetBtn">Reset All</button>
            </div>

            <main>
              <div class="players-grid" id="playersGrid"></div>
              <ttr-scoreboard id="scoreboard"></ttr-scoreboard>

              <div class="points-ref">
                <h3>Route Length → Points Reference</h3>
                <div class="ref-table">
                  <div class="ref-item">
                    <span class="ref-len">1</span><span class="ref-pts">= 1 pt</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">2</span><span class="ref-pts">= 2 pts</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">3</span><span class="ref-pts">= 4 pts</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">4</span><span class="ref-pts">= 7 pts</span>
                  </div>
                  <div class="ref-item" data-ref-edition="original">
                    <span class="ref-len">5</span><span class="ref-pts">= 10 pts</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">6</span><span class="ref-pts">= 15 pts</span>
                  </div>
                  <div class="ref-item" data-ref-edition="europe" style="display:none">
                    <span class="ref-len">8</span><span class="ref-pts">= 21 pts</span>
                  </div>
                </div>
              </div>
            </main>
          `;

          this.querySelector("#addPlayerBtn")?.addEventListener("click", () => {
            this.addPlayer();
          }, { signal: this._ac.signal });

          this.querySelector("#resetBtn")?.addEventListener("click", () => {
            this.resetAll();
          }, { signal: this._ac.signal });

          this.querySelector("#editionBtn")?.addEventListener("click", () => {
            const current = this.store.getValue("edition") || "original";
            this.store.setValue("edition", current === "original" ? "europe" : "original");
            this.syncEdition();
          }, { signal: this._ac.signal });
        }

        syncEdition() {
          const edition = this.store.getValue("edition") || "original";
          const btn = this.querySelector("#editionBtn");
          if (btn) btn.textContent = edition === "original" ? "Original" : "Europe";
          this.querySelectorAll("[data-ref-edition]").forEach((el) => {
            el.style.display = el.dataset.refEdition === edition ? "" : "none";
          });
          this.renderPlayers();
        }

        getPlayers() {
          const playersTable = this.store.getTable("players") || {};
          const players = Object.entries(playersTable).map(([id, row]) => {
            const routes = this.getRoutesForPlayer(id).map((route) => route.len);
            return {
              id,
              name: String(row.name || "Player"),
              color: String(row.color || PLAYER_COLORS[0]),
              destinationPoints: Number(row.destinationPoints || 0),
              longestRoute: Boolean(row.longestRoute),
              stationsUsed: Number(row.stationsUsed || 0),
              routes,
              order: Number(row.order || 0),
            };
          });

          players.sort((a, b) => a.order - b.order || Number(a.id) - Number(b.id));
          return players;
        }

        getRoutesForPlayer(playerId) {
          const routes = this.store.getTable("routes") || {};
          const playerRoutes = Object.entries(routes)
            .filter(([, route]) => String(route.playerId) === String(playerId))
            .map(([id, route]) => ({
              id,
              len: Number(route.len || 0),
              order: Number(route.order || 0),
            }));

          playerRoutes.sort((a, b) => a.order - b.order || Number(a.id) - Number(b.id));
          return playerRoutes;
        }

        addPlayer() {
          const id = String(this.store.getValue("nextPlayerId") || 1);
          const playerCount = Object.keys(this.store.getTable("players") || {}).length;
          const colorIndex = playerCount % PLAYER_COLORS.length;
          this.store.transaction(() => {
            this.store.setRow("players", id, {
              name: `Player ${playerCount + 1}`,
              color: PLAYER_COLORS[colorIndex],
              destinationPoints: 0,
              longestRoute: false,
              stationsUsed: 0,
              order: playerCount,
            });
            this.store.setValue("nextPlayerId", Number(id) + 1);
          });
          this.renderPlayers();
        }

        refreshPlayerCard(playerId) {
          const player = this.getPlayers().find((entry) => String(entry.id) === String(playerId));
          if (!player) {
            this.renderPlayers();
            return;
          }

          const card = Array.from(this.querySelectorAll("ttr-player-card")).find(
            (entry) => entry.dataset.playerId === String(playerId),
          );

          if (!card) {
            this.renderPlayers();
            return;
          }

          card.player = player;
          card.scorer = SCORERS[this.store.getValue("edition") || "original"];
          card.dataset.playerId = player.id;
          this.updateScoreboard();
        }

        resetAll() {
          if (confirm("Reset all scores? Player names will be kept.")) {
            this.store.transaction(() => {
              const players = this.store.getTable("players") || {};
              Object.keys(players).forEach((id) => {
                this.store.setCell("players", id, "destinationPoints", 0);
                this.store.setCell("players", id, "longestRoute", false);
                this.store.setCell("players", id, "stationsUsed", 0);
              });

              const routes = this.store.getTable("routes") || {};
              Object.keys(routes).forEach((routeId) => {
                this.store.delRow("routes", routeId);
              });
            });
            this.renderPlayers();
          }
        }

        renderPlayers() {
          const grid = this.querySelector("#playersGrid");
          if (!grid) return;

          const players = this.getPlayers();
          const edition = this.store.getValue("edition") || "original";

          if (players.length === 0) {
            grid.innerHTML =
              '<div class="empty-state">Add players to begin tracking scores</div>';
            this.updateScoreboard();
            return;
          }

          const existing = new Map(
            Array.from(grid.querySelectorAll("ttr-player-card")).map((el) => [el.dataset.playerId, el]),
          );

          const fragment = document.createDocumentFragment();
          for (const player of players) {
            let card = existing.get(player.id);
            if (!card) {
              card = document.createElement("ttr-player-card");
              card.dataset.playerId = player.id;
            }
            card.player = player;
            card.scorer = SCORERS[edition];
            fragment.appendChild(card);
          }
          grid.replaceChildren(fragment);

          this.updateScoreboard();
        }

        updateScoreboard() {
          const scoreboard = this.querySelector("#scoreboard");
          if (scoreboard) {
            scoreboard.scorer = SCORERS[this.store.getValue("edition") || "original"];
            scoreboard.players = this.getPlayers();
          }
        }
      }

      customElements.define("ttr-player-card", TTRPlayerCard);
      customElements.define("ttr-scoreboard", TTRScoreboard);
      customElements.define("ttr-score-app", TTRScoreApp);
    </script>
  </body>
</html>

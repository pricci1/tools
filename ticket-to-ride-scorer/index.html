<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket to Ride — Score Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f5efe3;
        --dark: #1a1208;
        --brown: #5c3d1e;
        --rust: #c0392b;
        --gold: #d4a017;
        --green: #27623a;
        --card-bg: #fdf8f0;
        --border: #c9b08a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--cream);
        color: var(--dark);
        font-family: "Crimson Pro", serif;
        min-height: 100vh;
        background-image:
          radial-gradient(
            ellipse at 20% 80%,
            rgba(92, 61, 30, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(192, 57, 43, 0.06) 0%,
            transparent 50%
          );
      }

      header {
        text-align: center;
        padding: 2rem 1rem 1rem;
        border-bottom: 2px solid var(--border);
        background: var(--card-bg);
        box-shadow: 0 2px 12px rgba(92, 61, 30, 0.1);
        position: relative;
        overflow: hidden;
      }

      header::before {
        content: "🚂";
        position: absolute;
        font-size: 8rem;
        opacity: 0.04;
        right: 5%;
        top: -10px;
        transform: rotate(-10deg);
      }

      header h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.8rem, 5vw, 3rem);
        font-weight: 900;
        letter-spacing: 0.02em;
        color: var(--brown);
      }

      header p {
        font-style: italic;
        color: var(--rust);
        font-size: 1.1rem;
        margin-top: 0.25rem;
      }

      .controls {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        padding: 1.25rem 1rem;
        flex-wrap: wrap;
        background: var(--dark);
      }

      .btn {
        font-family: "Crimson Pro", serif;
        font-size: 1rem;
        padding: 0.5rem 1.25rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.03em;
      }

      .btn-primary {
        background: var(--gold);
        color: var(--dark);
        font-weight: 400;
      }
      .btn-primary:hover {
        background: #e6b020;
        transform: translateY(-1px);
      }

      .btn-danger {
        background: var(--rust);
        color: white;
      }
      .btn-danger:hover {
        background: #a93226;
      }

      .btn-ghost {
        background: transparent;
        color: var(--cream);
        border: 1px solid rgba(245, 239, 227, 0.3);
      }
      .btn-ghost:hover {
        background: rgba(245, 239, 227, 0.1);
      }

      .btn-sm {
        font-size: 0.85rem;
        padding: 0.3rem 0.75rem;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem 1rem 4rem;
      }

      /* Players grid */
      .players-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.25rem;
        margin-bottom: 2rem;
      }

      .player-card {
        background: var(--card-bg);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(92, 61, 30, 0.08);
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .player-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--border);
      }

      .player-color-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.15);
        flex-shrink: 0;
      }

      .player-name-input {
        font-family: "Playfair Display", serif;
        font-size: 1.15rem;
        font-weight: 700;
        background: transparent;
        border: none;
        border-bottom: 1px dashed transparent;
        color: var(--dark);
        flex: 1;
        min-width: 0;
        padding: 2px 0;
        transition: border-color 0.2s;
      }
      .player-name-input:focus {
        outline: none;
        border-bottom-color: var(--gold);
      }

      .player-total {
        font-family: "Playfair Display", serif;
        font-size: 1.6rem;
        font-weight: 900;
        color: var(--rust);
        min-width: 48px;
        text-align: right;
      }

      .btn-remove-player {
        background: none;
        border: none;
        color: var(--border);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 2px 4px;
        transition: color 0.15s;
        line-height: 1;
      }
      .btn-remove-player:hover {
        color: var(--rust);
      }

      .score-section {
        padding: 0.75rem 1rem;
      }

      .score-section-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--brown);
        margin-bottom: 0.5rem;
        font-style: italic;
      }

      /* Route rows */
      .routes-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .route-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(92, 61, 30, 0.04);
        border-radius: 4px;
        padding: 4px 6px;
      }

      .route-len-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: var(--cream);
        color: var(--brown);
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.12s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .route-len-btn:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--dark);
      }

      .route-pts {
        font-size: 0.8rem;
        color: #666;
        font-style: italic;
        flex: 1;
      }

      .route-pts strong {
        color: var(--green);
        font-style: normal;
      }

      .btn-remove-route {
        background: none;
        border: none;
        color: var(--border);
        cursor: pointer;
        font-size: 0.95rem;
        padding: 2px;
        line-height: 1;
        transition: color 0.15s;
      }
      .btn-remove-route:hover {
        color: var(--rust);
      }

      .add-route-row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 6px;
      }

      .len-chip {
        font-family: "Crimson Pro", serif;
        font-size: 0.85rem;
        padding: 3px 10px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--cream);
        cursor: pointer;
        transition: all 0.12s;
        color: var(--brown);
      }
      .len-chip:hover {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--dark);
      }

      /* Special scores */
      .special-scores {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .special-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .special-field label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--brown);
        font-style: italic;
      }

      .special-input {
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        width: 100%;
        padding: 4px 8px;
        border: 1.5px solid var(--border);
        border-radius: 4px;
        background: var(--cream);
        color: var(--dark);
        text-align: center;
      }
      .special-input:focus {
        outline: none;
        border-color: var(--gold);
      }

      /* Divider */
      .section-divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 0.6rem 0;
      }

      /* Score breakdown */
      .score-breakdown {
        font-size: 0.8rem;
        color: #777;
        font-style: italic;
        padding: 0 1rem 0.6rem;
      }

      /* Scoreboard */
      .scoreboard {
        background: var(--dark);
        color: var(--cream);
        border-radius: 8px;
        padding: 1.5rem;
        margin-top: 2rem;
      }

      .scoreboard h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.4rem;
        color: var(--gold);
        margin-bottom: 1rem;
        border-bottom: 1px solid rgba(212, 160, 23, 0.3);
        padding-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      .scoreboard-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(245, 239, 227, 0.08);
        transition: all 0.3s;
      }

      .rank {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        font-weight: 900;
        color: rgba(212, 160, 23, 0.4);
        min-width: 2rem;
      }

      .scoreboard-row.rank-1 .rank {
        color: var(--gold);
      }
      .scoreboard-row.rank-1 {
        background: rgba(212, 160, 23, 0.08);
        border-radius: 4px;
        padding-left: 0.5rem;
      }

      .sb-name {
        flex: 1;
        font-size: 1.1rem;
        font-weight: 300;
      }

      .sb-details {
        font-size: 0.78rem;
        color: rgba(245, 239, 227, 0.45);
        font-style: italic;
      }

      .sb-score {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        font-weight: 900;
        color: var(--rust);
      }

      .scoreboard-row.rank-1 .sb-score {
        color: var(--gold);
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--brown);
        font-style: italic;
        opacity: 0.6;
      }

      /* Route points table */
      .points-ref {
        background: var(--card-bg);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-top: 1.5rem;
        font-size: 0.9rem;
      }

      .points-ref h3 {
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        color: var(--brown);
        margin-bottom: 0.5rem;
      }

      .ref-table {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .ref-item {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .ref-len {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: 1rem;
        color: var(--dark);
        min-width: 1.5rem;
      }

      .ref-pts {
        color: var(--green);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <ttr-score-app></ttr-score-app>

    <script>
      const ROUTE_POINTS = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 10, 6: 15 };
      const PLAYER_COLORS = [
        "#e74c3c",
        "#2980b9",
        "#27ae60",
        "#f39c12",
        "#8e44ad",
        "#1abc9c",
        "#e67e22",
        "#2c3e50",
      ];

      function calcRoutePoints(routes) {
        return routes.reduce((sum, len) => sum + (ROUTE_POINTS[len] || 0), 0);
      }

      function calcTotal(p) {
        return (
          calcRoutePoints(p.routes) +
          Number(p.destinationPoints || 0) +
          (p.longestRoute ? 10 : 0)
        );
      }

      function escHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      class TTRPlayerCard extends HTMLElement {
        set player(data) {
          this._player = data;
          this.render();
        }

        get player() {
          return this._player;
        }

        connectedCallback() {
          this.render();
        }

        emit(name, detail) {
          this.dispatchEvent(
            new CustomEvent(name, {
              bubbles: true,
              detail,
            }),
          );
        }

        render() {
          if (!this._player) return;

          const p = this._player;
          const routePts = calcRoutePoints(p.routes);
          const total = calcTotal(p);
          this.className = "player-card";
          this.innerHTML = `
            <div class="player-header">
              <div class="player-color-dot" style="background:${p.color}"></div>
              <input class="player-name-input" value="${escHtml(p.name)}" placeholder="Player name">
              <span class="player-total">${total}</span>
              <button class="btn-remove-player" type="button" title="Remove player">✕</button>
            </div>

            <div class="score-section">
              <div class="score-section-title">Routes Claimed</div>
              <div class="routes-list">
                ${p.routes
                  .map(
                    (len, idx) => `
                      <div class="route-row">
                        <span class="route-len-btn">${len}</span>
                        <span class="route-pts">${len} cars → <strong>${ROUTE_POINTS[len]} pts</strong></span>
                        <button class="btn-remove-route" type="button" data-route-index="${idx}">✕</button>
                      </div>
                    `,
                  )
                  .join("")}
              </div>
              <div class="add-route-row">
                ${[1, 2, 3, 4, 5, 6]
                  .map(
                    (len) =>
                      `<button class="len-chip" type="button" data-route-len="${len}">${len}</button>`,
                  )
                  .join("")}
              </div>
            </div>

            <hr class="section-divider">

            <div class="score-section">
              <div class="special-scores">
                <div class="special-field">
                  <label>Destination Tickets (net)</label>
                  <input type="number" class="special-input" value="${p.destinationPoints}" placeholder="0">
                </div>
                <div class="special-field">
                  <label>Longest Route +10</label>
                  <select class="special-input">
                    <option value="false" ${!p.longestRoute ? "selected" : ""}>No</option>
                    <option value="true" ${p.longestRoute ? "selected" : ""}>Yes (+10)</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="score-breakdown">
              Routes: ${routePts} · Tickets: ${p.destinationPoints > 0 ? "+" : ""}${p.destinationPoints || 0} · Longest: ${p.longestRoute ? "+10" : "0"} = <strong>${total} pts</strong>
            </div>
          `;

          this.querySelector(".player-name-input")?.addEventListener("input", (event) => {
            this.emit("name-change", {
              id: p.id,
              name: event.target.value,
            });
          });

          this.querySelector(".btn-remove-player")?.addEventListener("click", () => {
            this.emit("remove-player", { id: p.id });
          });

          this.querySelectorAll("[data-route-len]").forEach((button) => {
            button.addEventListener("click", () => {
              this.emit("add-route", {
                id: p.id,
                len: Number(button.dataset.routeLen),
              });
            });
          });

          this.querySelectorAll("[data-route-index]").forEach((button) => {
            button.addEventListener("click", () => {
              this.emit("remove-route", {
                id: p.id,
                index: Number(button.dataset.routeIndex),
              });
            });
          });

          this.querySelector("input.special-input")?.addEventListener("input", (event) => {
            this.emit("destination-change", {
              id: p.id,
              destinationPoints: Number(event.target.value) || 0,
            });
          });

          this.querySelector("select.special-input")?.addEventListener("change", (event) => {
            this.emit("longest-route-change", {
              id: p.id,
              longestRoute: event.target.value === "true",
            });
          });
        }
      }

      class TTRScoreboard extends HTMLElement {
        set players(data) {
          this._players = data;
          this.render();
        }

        render() {
          const players = this._players || [];
          if (players.length === 0) {
            this.style.display = "none";
            return;
          }

          this.style.display = "block";
          const sorted = [...players].sort((a, b) => calcTotal(b) - calcTotal(a));
          this.className = "scoreboard";
          this.innerHTML = `
            <h2>🏆 Leaderboard</h2>
            <div>
              ${sorted
                .map(
                  (p, i) => `
                    <div class="scoreboard-row rank-${i + 1}">
                      <span class="rank">${i + 1}</span>
                      <div class="player-color-dot" style="background:${p.color}"></div>
                      <span class="sb-name">${escHtml(p.name)}</span>
                      <span class="sb-details">${p.routes.length} routes · ${calcRoutePoints(p.routes)}+${p.destinationPoints || 0}${p.longestRoute ? "+10" : ""}</span>
                      <span class="sb-score">${calcTotal(p)}</span>
                    </div>
                  `,
                )
                .join("")}
            </div>
          `;
        }
      }

      class TTRScoreApp extends HTMLElement {
        constructor() {
          super();
          this.players = [];
          this.nextId = 1;
        }

        connectedCallback() {
          this.renderShell();
          this.addEventListener("name-change", (event) => {
            const player = this.findPlayer(event.detail.id);
            if (player) {
              player.name = event.detail.name;
              this.updateScoreboard();
            }
          });

          this.addEventListener("remove-player", (event) => {
            this.players = this.players.filter((p) => p.id !== event.detail.id);
            this.renderPlayers();
          });

          this.addEventListener("add-route", (event) => {
            const player = this.findPlayer(event.detail.id);
            if (player) {
              player.routes.push(event.detail.len);
              this.renderPlayers();
            }
          });

          this.addEventListener("remove-route", (event) => {
            const player = this.findPlayer(event.detail.id);
            if (player) {
              player.routes.splice(event.detail.index, 1);
              this.renderPlayers();
            }
          });

          this.addEventListener("destination-change", (event) => {
            const player = this.findPlayer(event.detail.id);
            if (player) {
              player.destinationPoints = event.detail.destinationPoints;
              this.updateScoreboard();
            }
          });

          this.addEventListener("longest-route-change", (event) => {
            const player = this.findPlayer(event.detail.id);
            if (player) {
              player.longestRoute = event.detail.longestRoute;
              this.updateScoreboard();
            }
          });

          this.addPlayer();
          this.addPlayer();
        }

        renderShell() {
          this.innerHTML = `
            <header>
              <h1>Ticket to Ride</h1>
              <p>Score Tracker — Original Edition</p>
            </header>

            <div class="controls">
              <button class="btn btn-primary" type="button" id="addPlayerBtn">+ Add Player</button>
              <button class="btn btn-ghost" type="button" id="resetBtn">Reset All</button>
            </div>

            <main>
              <div class="players-grid" id="playersGrid"></div>
              <ttr-scoreboard id="scoreboard"></ttr-scoreboard>

              <div class="points-ref">
                <h3>Route Length → Points Reference</h3>
                <div class="ref-table">
                  <div class="ref-item">
                    <span class="ref-len">1</span><span class="ref-pts">= 1 pt</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">2</span><span class="ref-pts">= 2 pts</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">3</span><span class="ref-pts">= 4 pts</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">4</span><span class="ref-pts">= 7 pts</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">5</span><span class="ref-pts">= 10 pts</span>
                  </div>
                  <div class="ref-item">
                    <span class="ref-len">6</span><span class="ref-pts">= 15 pts</span>
                  </div>
                </div>
              </div>
            </main>
          `;

          this.querySelector("#addPlayerBtn")?.addEventListener("click", () => {
            this.addPlayer();
          });

          this.querySelector("#resetBtn")?.addEventListener("click", () => {
            this.resetAll();
          });
        }

        findPlayer(id) {
          return this.players.find((p) => p.id === id);
        }

        addPlayer() {
          const id = this.nextId++;
          const colorIndex = this.players.length % PLAYER_COLORS.length;
          this.players.push({
            id,
            name: `Player ${this.players.length + 1}`,
            color: PLAYER_COLORS[colorIndex],
            routes: [],
            destinationPoints: 0,
            longestRoute: false,
          });
          this.renderPlayers();
        }

        resetAll() {
          if (confirm("Reset all scores? Player names will be kept.")) {
            this.players.forEach((p) => {
              p.routes = [];
              p.destinationPoints = 0;
              p.longestRoute = false;
            });
            this.renderPlayers();
          }
        }

        renderPlayers() {
          const grid = this.querySelector("#playersGrid");
          if (!grid) return;

          if (this.players.length === 0) {
            grid.innerHTML =
              '<div class="empty-state">Add players to begin tracking scores</div>';
            this.updateScoreboard();
            return;
          }

          grid.innerHTML = "";
          this.players.forEach((player) => {
            const card = document.createElement("ttr-player-card");
            card.player = player;
            grid.appendChild(card);
          });

          this.updateScoreboard();
        }

        updateScoreboard() {
          const scoreboard = this.querySelector("#scoreboard");
          if (scoreboard) {
            scoreboard.players = this.players;
          }
        }
      }

      customElements.define("ttr-player-card", TTRPlayerCard);
      customElements.define("ttr-scoreboard", TTRScoreboard);
      customElements.define("ttr-score-app", TTRScoreApp);
    </script>
  </body>
</html>
